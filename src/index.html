<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Kanban</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <h1>Simple Kanban</h1>

  <div id="auth-section">
    <button id="loginBtn" style="display:none;">Access</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
  </div>

  <button id="addBoardBtn" style="display:none;">+ New board</button>
  <button id="addCardBtn" style="display:none;">+ New card</button>
  <div>
    <select id="board-select" style="display:none;"></select>
    <button id="board-menu-btn" style="display:none;">⋮</button>
  </div>
  <div id="kanban" class="kanban-content"></div>

  <template id="card-template">
    <div class="card">
      <h3 class="card-title"></h3>
      <p class="card-description"></p>
      <span class="card-priority"></span>
    </div>
  </template>

  <dialog id="edit-dialog">
    <form method="dialog" class="dialog-form">
      <h2 id="dialog-title"></h2>

      <label class="dialog-form-label">
        Title:
        <input type="text" id="dialog-card-title" />
      </label>

      <label class="dialog-form-label">
        Description:
        <textarea id="dialog-card-description"></textarea>
      </label>

      <label>
        Priority:
        <select id="dialog-card-priority"></select>
      </label>
      <label>
        Assigned:
        <select id="dialog-card-assigned"></select>
      </label>

      <menu>
        <button id="dialog-btn-delete" class="btn btn-delete" value="cancel">Delete</button>
        <button id="dialog-btn-cancel" class="btn btn-cancel" value="cancel">Cancel</button>
        <button id="dialog-btn-save" class="btn btn-save" value="default">Save</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="./js/index.js"></script>
</body>

</html>
