<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Kanban</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div id="top-bar">
    <h1>Simple Kanban</h1>
    <div id="user-info" class="user-info" aria-live="polite"></div>
  </div>

  <div id="auth-section">
    <button id="loginBtn" style="display:none;">Access</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
  </div>

  <button id="addBoardBtn" style="display:none;">+ New board</button>
  <button id="addCardBtn" style="display:none;">+ New card</button>
  <div>
    <select id="board-select" style="display:none;"></select>
    <button id="board-menu-btn" style="display:none;">⋮</button>
  </div>

  <div id="empty-state" style="display:none;">
    <p>No tienes tableros aún.</p>
    <button id="empty-create-btn" class="btn">+ Crear tablero</button>
  </div>

  <div id="kanban" class="kanban-content"></div>

  <template id="card-template">
    <div class="card">
      <h3 class="card-title"></h3>
      <p class="card-description"></p>
      <span class="card-priority"></span>
    </div>
  </template>

  <script type="module" src="./js/index.js"></script>
</body>

</html>
